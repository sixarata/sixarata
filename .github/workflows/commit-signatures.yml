name: Commit signatures

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Verify signed commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Reject unverified commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          unverified="$(gh api --paginate \
            "repos/$REPOSITORY/pulls/$PULL_REQUEST/commits" \
            --jq '.[] | select(.commit.verification.verified != true) | .sha')"

          if test -n "$unverified"; then
            echo "Every pull-request commit must have a GitHub-verified signature."
            echo "$unverified"
            exit 1
          fi

          echo "All pull-request commits have verified signatures."
